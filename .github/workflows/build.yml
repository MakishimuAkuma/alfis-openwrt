name: Build Alfis OpenWrt APK

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.5
  FEED_BRANCH: gh-pages
  FEED_ROOT: 25.12

jobs:
  check:
    name: Check Alfis stable release
    runs-on: [self-hosted, Linux, X64]
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      hash: ${{ steps.check.outputs.hash }}

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          command -v sudo
          command -v curl
          command -v jq
          command -v git
          command -v openssl
          docker version

      - name: Check latest stable Alfis release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          UPSTREAM_API="https://api.github.com/repos/Revertron/Alfis/releases/latest"
          RELEASE_JSON="$(curl -fsSL --retry 5 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$UPSTREAM_API")"

          TAG="$(jq -r '.tag_name // ""' <<<"$RELEASE_JSON")"
          VERSION="${TAG#v}"

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: Could not determine latest Alfis stable release"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Unexpected Alfis release tag: $TAG"
            exit 1
          fi

          CURRENT="$(sed -n 's/^PKG_VERSION:=//p' alfis/Makefile | head -n1)"
          CURRENT_TAG=""
          RELEASE_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          RELEASE_TMP="$(mktemp)"
          trap 'rm -f "$RELEASE_TMP"' EXIT

          RELEASE_STATUS="$(curl -sS --retry 5 --retry-delay 2 -o "$RELEASE_TMP" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$RELEASE_API")"

          if [ "$RELEASE_STATUS" = "200" ]; then
            CURRENT_TAG="$(jq -r '.tag_name // ""' "$RELEASE_TMP")"
            CURRENT_TAG="${CURRENT_TAG#v}"
          elif [ "$RELEASE_STATUS" = "404" ]; then
            echo "No published Alfis package release found; this will be the initial release."
          else
            echo "ERROR: GitHub Releases API returned HTTP $RELEASE_STATUS"
            cat "$RELEASE_TMP"
            exit 1
          fi

          echo "Latest upstream Alfis tag: $TAG"
          echo "Latest package release:    ${CURRENT_TAG:-<none>}"
          echo "Package Makefile version:  ${CURRENT:-<empty>}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          BUILD=true

          if [ -n "$CURRENT_TAG" ] && [ "$(printf '%s\n' "$CURRENT_TAG" "$VERSION" | sort -V | tail -n1)" = "$CURRENT_TAG" ]; then
            echo "Latest package release ($CURRENT_TAG) is equal to or newer than upstream ($VERSION)."
            BUILD=false
          fi

          if [ -n "$CURRENT" ] && [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] &&
             [ "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" = "$CURRENT" ] &&
             [ "$CURRENT" != "$VERSION" ]; then
            echo "Makefile version ($CURRENT) is newer than upstream ($VERSION); refusing downgrade."
            BUILD=false
          fi

          if [ "$BUILD" = true ]; then
            SOURCE_URL="https://github.com/Revertron/Alfis/archive/refs/tags/${TAG}.tar.gz"
            TMP="$(mktemp)"
            trap 'rm -f "$TMP" "$RELEASE_TMP"' EXIT
            echo "Downloading Alfis source: $SOURCE_URL"
            curl -fL --retry 5 --retry-delay 2 -o "$TMP" "$SOURCE_URL"
            HASH="$(sha256sum "$TMP" | awk '{print $1}')"
            echo "Source SHA256: $HASH"
            echo "hash=$HASH" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip build when already current
        if: steps.check.outputs.build == 'false'
        run: |
          echo "No new stable Alfis release. Nothing to build."

  update-makefile:
    name: Update Alfis Makefile
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Update Alfis package version and source hash
        shell: bash
        env:
          ALFIS_VERSION: ${{ needs.check.outputs.version }}
          ALFIS_HASH: ${{ needs.check.outputs.hash }}
        run: |
          set -euo pipefail

          test -n "$ALFIS_VERSION"
          test -n "$ALFIS_HASH"

          grep -q '^PKG_VERSION:=' alfis/Makefile
          grep -q '^PKG_SOURCE:=' alfis/Makefile
          grep -q '^PKG_SOURCE_SUBDIR:=' alfis/Makefile
          grep -q '^PKG_BUILD_DIR:=' alfis/Makefile
          grep -q '^PKG_HASH:=' alfis/Makefile

          sed -i -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${ALFIS_VERSION}/" alfis/Makefile
          sed -i -E "s#^PKG_SOURCE:=.*#PKG_SOURCE:=v${ALFIS_VERSION}.tar.gz#" alfis/Makefile
          sed -i -E "s#^PKG_SOURCE_SUBDIR:=.*#PKG_SOURCE_SUBDIR:=Alfis-${ALFIS_VERSION}#" alfis/Makefile
          sed -i -E 's#^PKG_BUILD_DIR:=.*#PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_SOURCE_SUBDIR)#' alfis/Makefile
          sed -i -E "s/^PKG_HASH:=.*/PKG_HASH:=${ALFIS_HASH}/" alfis/Makefile

          git diff --check
          git diff -- alfis/Makefile

          if git diff --quiet -- alfis/Makefile; then
            echo "Alfis Makefile already has the requested version and hash."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alfis/Makefile
          git commit -m "Update Alfis to ${ALFIS_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  discover:
    name: Discover OpenWrt 25.12.5 architectures
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64]
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}

    steps:
      - name: Discover supported package architectures
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/packages"

          CANDIDATES=(
            arm_cortex-a5_vfpv4
            arm_cortex-a7_neon-vfpv4
            arm_cortex-a8_vfpv3
            arm_cortex-a9
            arm_cortex-a9_vfpv3-d16
            arm_cortex-a9_neon
            arm_cortex-a15_neon-vfpv4
            aarch64_cortex-a53
            aarch64_cortex-a72
            aarch64_cortex-a76
            aarch64_generic
            mips_24kc
            mips_mips32
            mipsel_24kc
            mipsel_24kc_24kf
            mipsel_74kc
            mipsel_mips32
            mips64_octeonplus
            riscv64_generic
            loongarch64_generic
            i386_pentium4
            x86_64
          )

          ARCHS=()

          for ARCH in "${CANDIDATES[@]}"; do
            if curl -fsI "$BASE/$ARCH/" >/dev/null 2>&1; then
              ARCHS+=("$ARCH")
            else
              echo "Skipping unavailable OpenWrt package architecture: $ARCH"
            fi
          done

          if [ "${#ARCHS[@]}" -eq 0 ]; then
            echo "ERROR: No OpenWrt architectures found"
            exit 1
          fi

          JSON="$(printf '%s\n' "${ARCHS[@]}" | jq -Rsc '{arch: split("\n") | map(select(length > 0))}')"

          echo "OpenWrt architectures:"
          printf '  %s\n' "${ARCHS[@]}"

          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "count=${#ARCHS[@]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Alfis (${{ matrix.arch }})
    needs:
      - check
      - discover
      - update-makefile
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64]

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.discover.outputs.matrix).arch }}

    steps:
      - name: Checkout updated package feed
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set build parallelism
        shell: bash
        run: |
          set -euo pipefail
          CPUS="$(nproc)"
          echo "Runner CPUs: ${CPUS}"
          echo "MAKEFLAGS=-j${CPUS}" >> "$GITHUB_ENV"
          echo "CONFIG_BUILD_NCPUS=${CPUS}" >> "$GITHUB_ENV"

      - name: Verify Alfis package
        shell: bash
        run: |
          set -euo pipefail
          test -f alfis/Makefile
          test -f alfis/files/alfis.init
          test -f alfis/files/alfis.config
          test -f alfis/root/www/luci-static/resources/view/alfis/alfis.js
          echo "Building Alfis ${{ needs.check.outputs.version }} for ${{ matrix.arch }}"

      - name: Build OpenWrt Alfis package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_VERSION }}
          FEEDNAME: action
          PACKAGES: alfis
          INDEX: 1
          PRIVATE_KEY: ${{ secrets.APK_SIGNING_KEY }}
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          BUILD_LOG: 1
          V: s

      - name: Export public APK feed key
        shell: bash
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail

          PUB="artifacts/feed/${{ matrix.arch }}/alfis-feed.pub.pem"
          mkdir -p "$(dirname "$PUB")"

          if [ -z "${APK_SIGNING_KEY:-}" ]; then
            echo "ERROR: APK_SIGNING_KEY secret is empty or unavailable"
            exit 1
          fi

          printf '%s' "$APK_SIGNING_KEY" | openssl pkey -pubout -out "$PUB"
          chmod 644 "$PUB"
          echo "Exported public APK feed key: $PUB"

      - name: Collect Alfis artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts/release "artifacts/feed/${{ matrix.arch }}"

          APK="$(find bin -type f -name 'alfis-*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "ERROR: Alfis APK not found"
            find bin -type f -name '*.apk' -print || true
            exit 1
          fi

          cp "$APK" "artifacts/release/alfis-${{ matrix.arch }}.apk"

          FEED="$(find . -type f -name packages.adb -print -quit)"
          PUB="artifacts/feed/${{ matrix.arch }}/alfis-feed.pub.pem"

          if [ -z "$FEED" ]; then
            echo "ERROR: packages.adb not found"
            exit 1
          fi

          if [ ! -s "$PUB" ]; then
            echo "ERROR: public APK feed key was not generated: $PUB"
            exit 1
          fi

          cp "$FEED" "artifacts/feed/${{ matrix.arch }}/packages.adb"

          echo "Artifacts for ${{ matrix.arch }}:"
          find "artifacts/feed/${{ matrix.arch }}" -type f -print
          find artifacts/release -type f -print

      - name: Upload Alfis artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: alfis-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-alfis-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish Alfis release and feed
    needs:
      - check
      - discover
      - build
    if: needs.check.outputs.build == 'true'
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Alfis artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alfis-*
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts
        shell: bash
        env:
          EXPECTED: ${{ needs.discover.outputs.count }}
        run: |
          set -euo pipefail

          APK_COUNT="$(find artifacts/release -type f -name '*.apk' | wc -l)"
          FEED_COUNT="$(find artifacts -type f -name packages.adb | wc -l)"

          echo "Expected architectures: $EXPECTED"
          echo "APK count:              $APK_COUNT"
          echo "Feed count:             $FEED_COUNT"

          if [ "$APK_COUNT" -ne "$EXPECTED" ]; then
            echo "ERROR: Expected $EXPECTED Alfis APKs, found $APK_COUNT"
            exit 1
          fi

          if [ "$FEED_COUNT" -ne "$EXPECTED" ]; then
            echo "ERROR: Expected $EXPECTED packages.adb files, found $FEED_COUNT"
            exit 1
          fi

          PUB="$(find artifacts/feed -type f -name 'alfis-feed.pub.pem' | head -n1)"
          if [ -z "$PUB" ]; then
            echo "ERROR: No public APK feed key found"
            exit 1
          fi
          mkdir -p artifacts/release
          cp "$PUB" artifacts/release/alfis-feed.pub.pem

          find artifacts -type f -name '*.apk' -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Alfis ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/release/*.apk
            artifacts/release/alfis-feed.pub.pem
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish OpenWrt APK feed
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
          ARCH_JSON: ${{ needs.discover.outputs.matrix }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${FEED_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${FEED_BRANCH}:${FEED_BRANCH}"
            git worktree add feed-publish "${FEED_BRANCH}"
          else
            git worktree add --detach feed-publish
            git -C feed-publish switch --orphan "${FEED_BRANCH}"
            git -C feed-publish rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "feed-publish/${FEED_ROOT}"

          mapfile -t ARCHS < <(jq -r '.arch[]' <<<"${ARCH_JSON}")

          for ARCH in "${ARCHS[@]}"; do
            SRC="artifacts/feed/${ARCH}"
            if [ ! -f "${SRC}/packages.adb" ]; then
              echo "ERROR: Missing feed for ${ARCH}"
              exit 1
            fi

            mkdir -p "feed-publish/${FEED_ROOT}/${ARCH}"
            cp "${SRC}/packages.adb" "feed-publish/${FEED_ROOT}/${ARCH}/packages.adb"

            if [ -f "${SRC}/alfis-feed.pub.pem" ]; then
              cp "${SRC}/alfis-feed.pub.pem" "feed-publish/${FEED_ROOT}/${ARCH}/alfis-feed.pub.pem"
            fi
          done

          printf '%s\n' \
            '# Alfis OpenWrt APK feed' \
            '' \
            "Latest Alfis release: ${TAG}" \
            "OpenWrt release: ${OPENWRT_VERSION}" \
            '' \
            'Add the architecture-specific feed matching your device:' \
            '' \
            > feed-publish/README.md

          for ARCH in "${ARCHS[@]}"; do
            printf '%s\n' "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${FEED_ROOT}/${ARCH}" \
              >> feed-publish/README.md
          done

          touch feed-publish/.nojekyll

          git -C feed-publish add .
          if git -C feed-publish diff --cached --quiet; then
            echo "Feed is already up to date."
          else
            git -C feed-publish commit -m "Update Alfis ${TAG} feeds"
            git -C feed-publish push origin "${FEED_BRANCH}"
          fi
