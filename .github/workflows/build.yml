name: Build Alfis

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          wget \
          zlib1g-dev

      - name: Clone OpenWrt 25.12
        run: |
          git clone --depth=1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Update OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Alfis feed
        run: |
          rm -rf openwrt/feeds/alfis
          mkdir -p openwrt/feeds/alfis

          cp -a \
            Makefile \
            files \
            openwrt/feeds/alfis/

          if [ -d luci-app-alfis ]; then
            cp -a luci-app-alfis openwrt/feeds/alfis/
          fi

      - name: Link Alfis package
        working-directory: openwrt
        run: |
          mkdir -p package/alfis
          cp -a feeds/alfis/Makefile package/alfis/

          if [ -d feeds/alfis/files ]; then
            cp -a feeds/alfis/files package/alfis/
          fi

      - name: Link LuCI package
        working-directory: openwrt
        run: |
          if [ -d feeds/alfis/luci-app-alfis ]; then
            rm -rf package/luci-app-alfis
            cp -a feeds/alfis/luci-app-alfis package/luci-app-alfis
          fi

      - name: Configure target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mips64=y
          CONFIG_TARGET_mips64_octeonplus=y
          CONFIG_TARGET_mips64_octeonplus_DEVICE_generic=y

          CONFIG_PACKAGE_alfis=m
          CONFIG_PACKAGE_luci-app-alfis=m
          EOF

          make defconfig

      - name: Show Alfis Makefile
        working-directory: openwrt
        run: |
          echo "===== package/alfis/Makefile ====="
          cat package/alfis/Makefile

          if [ -f package/luci-app-alfis/Makefile ]; then
            echo "===== package/luci-app-alfis/Makefile ====="
            cat package/luci-app-alfis/Makefile
          fi

      - name: Prepare Rust host compiler
        working-directory: openwrt
        run: |
          make package/feeds/packages/rust/host/compile -j1 V=s

      - name: Compile Alfis
        working-directory: openwrt
        run: |
          make package/alfis/clean
          make package/alfis/compile -j1 V=s

      - name: Compile LuCI app
        working-directory: openwrt
        run: |
          if [ -d package/luci-app-alfis ]; then
            make package/luci-app-alfis/clean
            make package/luci-app-alfis/compile -j1 V=s
          fi

      - name: Collect packages
        working-directory: openwrt
        run: |
          mkdir -p ../artifacts

          find bin/packages \
            -type f \
            \( -name '*alfis*.apk' -o -name '*alfis*.ipk' \) \
            -exec cp -v {} ../artifacts/ \;

          find bin/packages \
            -type f \
            \( -name '*luci-app-alfis*.apk' -o -name '*luci-app-alfis*.ipk' \) \
            -exec cp -v {} ../artifacts/ \;

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: alfis-packages
          path: artifacts/
          if-no-files-found: error
